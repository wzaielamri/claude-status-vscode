<!doctype html>
<!--
  The webview in a browser, with demo data: build with `npm run build` and
  `node esbuild.mjs --harness`, serve the repository folder over http and open
  dev/harness.html. ?theme=dark|light|hc  ?width=360  ?tab=1  ?phase=0  ?week=1 (the Recap tab; ?span=day or all for a day or everything)  ?perms=1 (the Permissions tab)  ?rules=0 (its rule suggestions left out)
  ?live=1 (live mode: a working chat's step)  ?open=1 (subagents with two of them unfolded, a peek, recent chats, plans, memories and the stats)  ?digest=1 (the "while
  you were away" card)  ?hover=1 (the rows' hover
  buttons shown)  ?scroll=N (scrolled down N px)  ?stopped=1 (two chats here a usage limit
  stopped, one going on and keeping going)  ?stars=1 (starred chats and plans)  ?banner=0 (no "Demo data"
  line, for screenshots). Errors show in a red box.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Talpy Den webview</title>
    <link rel="stylesheet" href="../dist/webview-style.css" />
    <style>
      /* What VS Code puts on <html> for a theme (Dark Modern / Light Modern /
         Dark High Contrast), so the --cs-* tokens resolve the same way */
      html {
        --vscode-font-family: system-ui, "Ubuntu", "Droid Sans", sans-serif;
        --vscode-font-size: 13px;
        --vscode-font-weight: normal;
        --vscode-editor-font-family: "Droid Sans Mono", "monospace", monospace;
      }
      html[data-theme="dark"] {
        --vscode-foreground: #cccccc;
        --vscode-descriptionForeground: #9d9d9d;
        --vscode-disabledForeground: rgba(204, 204, 204, 0.5);
        --vscode-focusBorder: #0078d4;
        --vscode-charts-orange: #d18616;
        --vscode-errorForeground: #f85149;
        --vscode-testing-iconPassed: #73c991;
        --vscode-charts-green: #89d185;
        --vscode-badge-background: #616161;
        --vscode-badge-foreground: #f8f8f8;
        --vscode-widget-border: #313131;
        --vscode-list-hoverBackground: #2a2d2e;
        --vscode-toolbar-hoverBackground: rgba(90, 93, 94, 0.31);
        --vscode-textLink-foreground: #4daafc;
        --vscode-textCodeBlock-background: #2b2b2b;
        --vscode-scrollbar-shadow: #000000;
        --vscode-sideBar-background: #181818;
        --vscode-editor-background: #1f1f1f;
      }
      html[data-theme="light"] {
        --vscode-foreground: #3b3b3b;
        --vscode-descriptionForeground: #717171;
        --vscode-disabledForeground: rgba(97, 97, 97, 0.5);
        --vscode-focusBorder: #005fb8;
        --vscode-charts-orange: #d18616;
        --vscode-errorForeground: #e51400;
        --vscode-testing-iconPassed: #388a34;
        --vscode-charts-green: #388a34;
        --vscode-badge-background: #cccccc;
        --vscode-badge-foreground: #3b3b3b;
        --vscode-widget-border: #e5e5e5;
        --vscode-list-hoverBackground: #f2f2f2;
        --vscode-toolbar-hoverBackground: rgba(184, 184, 184, 0.31);
        --vscode-textLink-foreground: #005fb8;
        --vscode-textCodeBlock-background: #f8f8f8;
        --vscode-scrollbar-shadow: #dddddd;
        --vscode-sideBar-background: #f8f8f8;
        --vscode-editor-background: #ffffff;
      }
      html[data-theme="hc"] {
        --vscode-foreground: #ffffff;
        --vscode-descriptionForeground: rgba(255, 255, 255, 0.7);
        --vscode-disabledForeground: #a5a5a5;
        --vscode-focusBorder: #f38518;
        --vscode-contrastBorder: #6fc3df;
        --vscode-contrastActiveBorder: #f38518;
        --vscode-charts-orange: #ab5a00;
        --vscode-errorForeground: #f48771;
        --vscode-testing-iconPassed: #73c991;
        --vscode-charts-green: #89d185;
        --vscode-badge-background: #000000;
        --vscode-badge-foreground: #ffffff;
        --vscode-widget-border: #6fc3df;
        --vscode-textLink-foreground: #21a6ff;
        --vscode-sideBar-background: #000000;
        --vscode-editor-background: #000000;
      }
      body {
        background: var(--vscode-sideBar-background);
        min-height: 100vh;
      }
      body.tab {
        background: var(--vscode-editor-background);
      }
    </style>
    <script>
      // Stands in for VS Code: the API the webview gets, and what the
      // extension's HTML sets before the bundle runs
      (function () {
        const params = new URLSearchParams(location.search);
        const theme = params.get("theme") || "dark";
        document.documentElement.dataset.theme = theme;
        // ?open=1: the webview's saved state with the folded parts open
        let state = params.get("week") === "1" ? { ui: { tab: "week" } } : params.get("perms") === "1" ? { ui: { tab: "perms" } } : params.get("open") === "1"
          ? { ui: { agents: { "demo-1": true }, agentDetail: { "demo-1|a1": true, "demo-1|a2": true }, peek: { "demo-1": true },
                    recent: { "demo-personal": true }, plans: { "demo-personal": true }, memories: { "demo-personal": true }, stats: { "demo-personal": true } } }
          : undefined;
        function showError(text) {
          const box = document.createElement("pre");
          box.style.cssText = "position:fixed;left:0;right:0;bottom:0;margin:0;padding:6px;z-index:9;" +
            "background:#b00020;color:#fff;font:12px monospace;white-space:pre-wrap";
          box.textContent = text;
          document.body.appendChild(box);
        }
        window.addEventListener("error", (e) => showError("Error: " + e.message));
        window.addEventListener("unhandledrejection", (e) => showError("Unhandled: " + e.reason));
        window.acquireVsCodeApi = function () {
          return {
            postMessage(message) {
              console.log("[webview → extension]", JSON.stringify(message));
              // (harness.tsx answers some, as the extension would)
              window.dispatchEvent(new CustomEvent("harness-post", { detail: message }));
            },
            getState() {
              return state;
            },
            setState(next) {
              state = next;
            },
          };
        };
        window.TALPY_DEN = { editorTab: params.get("tab") === "1" };
      })();
    </script>
  </head>
  <body>
    <script>
      (function () {
        const params = new URLSearchParams(location.search);
        const theme = params.get("theme") || "dark";
        document.body.className =
          theme === "light" ? "vscode-light" : theme === "hc" ? "vscode-high-contrast" : "vscode-dark";
        if (params.get("tab") === "1") document.body.classList.add("tab");
        document.body.style.width = (Number(params.get("width")) || 360) + "px";
        if (params.get("hover") === "1") {
          const style = document.createElement("style");
          style.textContent = ".row-actions { opacity: 1 !important; }";
          document.head.appendChild(style);
        }
      })();
    </script>
    <script src="out/harness.js"></script>
  </body>
</html>
