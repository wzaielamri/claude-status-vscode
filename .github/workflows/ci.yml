name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public:
    name: Nothing private in the repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/check_public.py --all --history

  build:
    name: Build, test, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run package
      - name: Nothing private in the package
        run: |
          mkdir vsix
          unzip -q ./*.vsix -d vsix
          python3 scripts/check_public.py vsix

  python37:
    name: Backend on Python 3.7 (what SSH hosts may have)
    runs-on: ubuntu-latest
    container: python:3.7-slim
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I vendor/code/talpy_den.py --remote --done-hours 24 --recent 5 | tail -1 | python3 -c "import json,sys; d=json.loads(sys.stdin.read().split('@@talpy-den@@',1)[1]); assert d['ok'], d"
